<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1020 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modelo Integrado de Sistemas Complejos en Rehabilitación" id="diagrama5_modelo_integrado_complejidad-root">
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #diagrama5_modelo_integrado_complejidad-root { --color-paper:       #ffffff;
      --color-ink:         #0f172a;
      --color-muted:       #475569;
      --color-subtle:      #64748b;
      --color-border:      #cbd5e1;
      --color-border-sub:  #e2e8f0;
      --color-zone-bg:     #f8fafc;
      --color-node-bg:     #ffffff;
      --color-accent:      #1e3a8a;
      --color-accent-sub:  #2563eb;
      --color-accent-bg:   #eff6ff;
      --font-sans:         'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono:         'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #diagrama5_modelo_integrado_complejidad-root { font-family: var(--font-sans); color: var(--color-ink); }
      #diagrama5_modelo_integrado_complejidad-root .diagram-container { width: 100%; overflow-x: auto; background: #ffffff; }
      #diagrama5_modelo_integrado_complejidad-root .zone-title { font-family: var(--font-mono); font-size: 11px; font-weight: 600; fill: #475569; letter-spacing: 0.08em; text-transform: uppercase; }
      #diagrama5_modelo_integrado_complejidad-root .node-title { font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; fill: #0f172a; }
      #diagrama5_modelo_integrado_complejidad-root .node-tag { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; fill: #1e3a8a; letter-spacing: 0.04em; }
      #diagrama5_modelo_integrado_complejidad-root .node-sub { font-family: var(--font-mono); font-size: 11px; font-weight: 500; fill: #334155; }
      #diagrama5_modelo_integrado_complejidad-root .node-desc { font-family: var(--font-sans); font-size: 10px; font-weight: 400; fill: #64748b; line-height: 1.35; }
      #diagrama5_modelo_integrado_complejidad-root .conn-label { font-family: var(--font-mono); font-size: 9px; font-weight: 500; fill: #475569; }</style>
          <marker id="diagrama5_modelo_integrado_complejidad-m5-arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
            <polygon points="0 0, 7 3, 0 6" fill="#1e3a8a"/>
          </marker>
          <marker id="diagrama5_modelo_integrado_complejidad-m5-arr-gray" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
            <polygon points="0 0, 7 3, 0 6" fill="#64748b"/>
          </marker>
          <filter id="diagrama5_modelo_integrado_complejidad-m5-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.06"/>
          </filter>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- ======================================================= -->
        <!-- 4 COLUMNS: Stages of the Complex Systems Framework       -->
        <!-- ======================================================= -->

        <!-- Column 1: Escalas Temporales -->
        <rect x="25" y="35" width="220" height="470" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
        <text x="40" y="60" class="zone-title">1 · Escalas Temporales</text>

        <!-- Column 2: Espacio de Estados -->
        <rect x="270" y="35" width="225" height="470" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
        <text x="285" y="60" class="zone-title">2 · Espacio de Estados</text>

        <!-- Column 3: Dinámica Temporal -->
        <rect x="520" y="35" width="225" height="470" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
        <text x="535" y="60" class="zone-title" fill="#1e3a8a">3 · Métricas Complejidad</text>

        <!-- Column 4: Aplicación e Inferencia -->
        <rect x="770" y="35" width="225" height="470" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
        <text x="785" y="60" class="zone-title">4 · Monitoreo Clínico</text>

        <!-- ======================================================= -->
        <!-- CONNECTORS (Orthogonal)                                 -->
        <!-- ======================================================= -->
        <!-- Fast dynamics -> Latent Space -->
        <path d="M 225 150 H 250 V 175 H 285" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#diagrama5_modelo_integrado_complejidad-m5-arr-gray)"/>
        <!-- Slow dynamics -> Latent Space -->
        <path d="M 225 365 H 250 V 230 H 285" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#diagrama5_modelo_integrado_complejidad-m5-arr-gray)"/>

        <!-- Latent Space -> Metrics Box Top -->
        <path d="M 475 200 H 500 V 150 H 535" fill="none" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#diagrama5_modelo_integrado_complejidad-m5-arr)"/>
        <!-- Latent Space -> Metrics Box Bottom -->
        <path d="M 475 200 H 500 V 365 H 535" fill="none" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#diagrama5_modelo_integrado_complejidad-m5-arr)"/>

        <!-- Metrics Top -> Application Top -->
        <path d="M 725 150 L 785 150" fill="none" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#diagrama5_modelo_integrado_complejidad-m5-arr)"/>
        <!-- Metrics Bottom -> Application Bottom -->
        <path d="M 725 365 L 785 365" fill="none" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#diagrama5_modelo_integrado_complejidad-m5-arr)"/>

        <!-- Masks on connectors -->
        <rect x="236" y="195" width="28" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="250" y="205" text-anchor="middle" class="conn-label">FUS</text>

        <rect x="486" y="193" width="28" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="500" y="203" text-anchor="middle" class="conn-label">TRA</text>

        <!-- ======================================================= -->
        <!-- NODES                                                   -->
        <!-- ======================================================= -->

        <!-- Node 1A: Microrrelatos (Fast) -->
        <g id="node-fast-scale">
          <rect x="40" y="80" width="190" height="140" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="50" y="92" width="102" height="16" rx="3" fill="#f1f5f9"/>
          <text x="55" y="104" class="node-tag">DINÁMICA RÁPIDA</text>
          <text x="50" y="128" class="node-title">Microrrelatos Semanales</text>
          <text x="50" y="147" class="node-sub">Resolución: t = 1 semana</text>
          <text x="50" y="166" class="node-desc">Fluctuaciones afectivas, metas,</text>
          <text x="50" y="181" class="node-desc">desafíos situacionales y</text>
          <text x="50" y="196" class="node-desc">estrategias de afrontamiento.</text>
        </g>

        <!-- Node 1B: Batería Psicométrica (Slow) -->
        <g id="node-slow-scale">
          <rect x="40" y="295" width="190" height="140" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="50" y="307" width="102" height="16" rx="3" fill="#f1f5f9"/>
          <text x="55" y="319" class="node-tag">DINÁMICA LENTA</text>
          <text x="50" y="343" class="node-title">Sintomatología Clínica</text>
          <text x="50" y="362" class="node-sub">Resolución: quincenal</text>
          <text x="50" y="381" class="node-desc">Evolución inercial de síntomas:</text>
          <text x="50" y="396" class="node-desc">ATQ-8 (depresión), GAD-7</text>
          <text x="50" y="411" class="node-desc">(ansiedad), activación y EROS.</text>
        </g>

        <!-- Node 2: Espacio de Estados Conjunto -->
        <g id="node-state-space">
          <rect x="285" y="100" width="195" height="200" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="295" y="112" width="128" height="16" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="300" y="124" class="node-tag" fill="#1e3a8a">VARIEDAD TOPOLÓGICA</text>
          <text x="295" y="148" class="node-title">Espacio Latente z_t</text>
          <text x="295" y="167" class="node-sub">Espacio continuo ℝ⁶⁴</text>
          <line x1="295" y1="178" x2="465" y2="178" stroke="#e2e8f0" stroke-width="1"/>
          <text x="295" y="196" class="node-desc">Organización en atractores:</text>
          <text x="295" y="213" class="node-desc">• F1: Malestar / Desesperanza</text>
          <text x="295" y="228" class="node-desc">• F2: Afrontamiento y Metas</text>
          <text x="295" y="243" class="node-desc">• F3: Estabilidad y Reflexión</text>
          <text x="295" y="263" class="node-desc">Matriz de transición ergódica</text>
          <text x="295" y="278" class="node-desc">con persistencia P_ii > 0.44</text>
        </g>

        <!-- Node 3A: Inercia y Persistencia -->
        <g id="node-inertia">
          <rect x="535" y="80" width="195" height="140" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="545" y="92" width="120" height="16" rx="3" fill="#f1f5f9"/>
          <text x="550" y="104" class="node-tag">PERSISTENCIA Y MEMORIA</text>
          <text x="545" y="128" class="node-title">Inercia Temporal AR(1)</text>
          <text x="545" y="147" class="node-sub">Corrección Hurwicz: ρ̄ ≈ 0.45</text>
          <text x="545" y="166" class="node-desc">Memoria de largo alcance (Hurst)</text>
          <text x="545" y="181" class="node-desc">y entropía ordinal (0.87) que</text>
          <text x="545" y="196" class="node-desc">cuantifican la rigidez afectiva.</text>
        </g>

        <!-- Node 3B: Puntos de Cambio y EWS -->
        <g id="node-change-points">
          <rect x="535" y="295" width="195" height="140" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="545" y="307" width="126" height="16" rx="3" fill="#f1f5f9"/>
          <text x="550" y="319" class="node-tag">TRANSICIONES DE RÉGIMEN</text>
          <text x="545" y="343" class="node-title">Reconfiguraciones PELT</text>
          <text x="545" y="362" class="node-sub">Tasa media: 1.48 cambios/sujeto</text>
          <text x="545" y="381" class="node-desc">Detección de saltos discretos</text>
          <text x="545" y="396" class="node-desc">en la dinámica latente, sin</text>
          <text x="545" y="411" class="node-desc">sobreinterpretar bifurcaciones.</text>
        </g>

        <!-- Node 4A: Monitoreo Fenotípico -->
        <g id="node-monitoring">
          <rect x="785" y="80" width="195" height="140" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="795" y="92" width="118" height="16" rx="3" fill="#eff6ff"/>
          <text x="800" y="104" class="node-tag" fill="#1e3a8a">APLICACIÓN CLÍNICA</text>
          <text x="795" y="128" class="node-title">Monitoreo de Estabilidad</text>
          <text x="795" y="147" class="node-sub">Seguimiento Fenotípico</text>
          <text x="795" y="166" class="node-desc">Detección de consolidación del</text>
          <text x="795" y="181" class="node-desc">régimen abstinente y pérdida de</text>
          <text x="795" y="196" class="node-desc">resiliencia ante el tratamiento.</text>
        </g>

        <!-- Node 4B: Límites Epistemológicos -->
        <g id="node-limits">
          <rect x="785" y="295" width="195" height="140" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#diagrama5_modelo_integrado_complejidad-m5-shadow)"/>
          <rect x="795" y="307" width="128" height="16" rx="3" fill="#f1f5f9"/>
          <text x="800" y="319" class="node-tag">PRUDENCIA EPISTÉMICA</text>
          <text x="795" y="343" class="node-title">Límites de Predicción</text>
          <text x="795" y="362" class="node-sub">Paridad Estricta LOO-CV</text>
          <text x="795" y="381" class="node-desc">La inercia basal domina el pronóstico;</text>
          <text x="795" y="396" class="node-desc">el texto describe el proceso sin</text>
          <text x="795" y="411" class="node-desc">funcionar como oráculo predictivo.</text>
        </g>
      </svg>
